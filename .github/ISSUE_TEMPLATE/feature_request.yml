name: Feature request
description: A change that would make the hub more useful.
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is hard to do with the hub today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What should the app do, and what should it leave unchanged?
    validations:
      required: true
